[package]
name = "auth_crdt"
version = "0.1.0"
authors = [""]
edition = "2021"

[lib]
name = "auth_crdt"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }

[features]
debug = []

[dependencies]
anyhow = "1.0.68"
tokio = { version = "1.39.1", default-features = false, features = ["sync", "rt-multi-thread"] }
tracing-subscriber = "0.3.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.135"
matrix-sdk = "0.7.1"
automerge = "0.5.12"

#crypto
rand = "0.8.5"
digest = "0.10.7"
sha3 = "0.10.8"
hmac = "0.12.1"

# logging
log = "0.4.22"
chrono = "0.4.38"
env_logger = "0.9.0"


